<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>作業依頼 申請</title><link rel="stylesheet" href="/style.css">
<style>
  .menu { position: absolute; background: #fff; border: 1px solid #c8d1dc; list-style: none; margin: 0; padding: 2px 0; min-width: 220px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .menu li { padding: 4px 10px; cursor: pointer; } .menu li:hover { background: #eef3f8; }
  #GB_overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); }
  #GB_window { position: fixed; left: 50%; top: 80px; transform: translateX(-50%); width: 560px; background: #fff; border-radius: 6px; }
  #GB_window iframe { width: 100%; height: 260px; border: 0; }
  .poller { width: 0; height: 0; border: 0; position: absolute; }
</style></head>
<body>
<!-- 模擬業務ページ: フレームを多用する申請画面（選択メニューは body 直下に追加、確認ダイアログは入れ子の iframe） -->
<main class="card">
  <h1>作業依頼 申請</h1>
  <div class="row">申請種別*
    <span id="apply_type" style="display:inline-block"><label><span id="apply_type_text">（未選択）</span> <button type="button" aria-haspopup="menu">▼</button></label></span>
  </div>
  <div class="row">作業依頼*<div id="wr_box"><textarea name="work_request" rows="3" cols="60"></textarea></div></div>
  <div class="row"><input type="button" id="temp_save" value="一時保存"></div>
  <p id="flow-status" class="muted"></p>
</main>
<script>
  // 画面の中で動き続けるフレーム（読み込みを繰り返す。タブの読み込み状態が落ち着かない画面の再現）
  const poll = document.createElement('iframe');
  poll.className = 'poller'; poll.src = '/poll.html'; poll.title = 'poller';
  document.body.appendChild(poll);
  // 再生時の画面差分の再現: 設定があれば、隠しフレームを先頭に追加する（ダイアログの iframe の index がずれる）
  try { if (localStorage.getItem('mock.extraFrame') === '1') { const x = document.createElement('iframe'); x.className = 'poller'; x.src = 'about:blank'; x.title = 'extra'; document.body.insertBefore(x, document.body.firstChild); } } catch { /* ignore */ }

  const types = ['経費精算依頼', '出張申請依頼', '備品購入依頼', '休暇申請依頼', '契約確認依頼', '振替伝票依頼'];
  document.querySelector('#apply_type button').addEventListener('click', (e) => {
    document.querySelectorAll('ul.menu').forEach((m) => m.remove());
    const ul = document.createElement('ul');
    ul.className = 'menu'; ul.setAttribute('role', 'menu');
    const r = e.currentTarget.getBoundingClientRect();
    ul.style.left = `${r.left + scrollX}px`; ul.style.top = `${r.bottom + scrollY}px`;
    for (const t of types) {
      const li = document.createElement('li'); li.setAttribute('role', 'menuitem'); li.textContent = t;
      li.addEventListener('click', () => { document.getElementById('apply_type_text').textContent = t; ul.remove(); });
      ul.appendChild(li);
    }
    setTimeout(() => document.body.appendChild(ul), 120); // メニューは少し遅れて現れる
  });
  document.getElementById('temp_save').addEventListener('click', () => {
    if (document.getElementById('GB_window')) return;
    const ov = document.createElement('div'); ov.id = 'GB_overlay';
    const w = document.createElement('div'); w.id = 'GB_window';
    w.innerHTML = '<div class="caption">一時保存</div><div><iframe src="/gb-loader.html" title="dialog"></iframe></div>';
    document.body.append(ov, w);
  });
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || e.data?.t !== 'saved') return;
    document.getElementById('flow-status').textContent = `一時保存しています…（件名: ${e.data.name}）`;
    setTimeout(() => { location.href = `/flow-done.html?type=${encodeURIComponent(document.getElementById('apply_type_text').textContent)}`; }, 300);
  });
</script>
</body></html>
