<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>一時保存</title><link rel="stylesheet" href="/style.css"></head>
<body style="background:#fff;padding:8px"><!-- 模擬: 入れ子のフレーム内の入力と決定 -->
  <label>件名 <input type="text" name="matterName" size="40"></label>
  <div style="margin-top:8px"><button type="button" id="decide">決定</button></div>
<script>
  document.getElementById('decide').addEventListener('click', () => {
    const name = document.querySelector('input[name="matterName"]').value;
    if (!name) { alert('件名を入力してください'); return; }
    top.postMessage({ t: 'saved', name }, location.origin);
  });
</script>
</body></html>
